<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; max-width: 760px; margin: 0 auto; padding: 48px 20px; color: #171717; background: #fafafa; }
    a { color: #0645ad; }
    header { margin-bottom: 32px; }
    main { background: #fff; border: 1px solid #e5e5e5; padding: 28px; }
    h1 { line-height: 1.15; }
  </style>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>{{ content }}</main>
</body>
</html>
