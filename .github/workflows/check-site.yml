name: Validate Jekyll site
on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.json'
      - '**/*.yml'
      - 'robots.txt'
      - 'llms.txt'
      - 'Gemfile'
      - '.github/workflows/check-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated discovery endpoints
        run: |
          set -euo pipefail
          for page in sitemap.xml robots.txt feed.xml llms.txt api/articles.json blog/index.html; do
            test -s "_site/$page" || { echo "Missing $page"; exit 1; }
          done
          grep -q 'https://donberghuijs.nl/sitemap.xml' _site/robots.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_site/api/articles.json').read_text())
          assert data['site']=='https://donberghuijs.nl'
          assert isinstance(data['articles'],list)
          home=Path('_site/index.html').read_text()
          assert 'application/ld+json' in home
          print('Jekyll site discovery and JSON-LD verified')
          PY
