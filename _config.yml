title: "J.D. Berghuijs"
site_name: "J.D. Berghuijs — Onderzoekswerkplaats"
tagline: "Onderzoek, beleid en essays"
description: "Onafhankelijk onderzoek naar beleid en besluitvorming. Historische reconstructies, primaire bronnen en controleerbare onderzoeksbevindingen."
image: "/assets/images/social-preview-v3.png"
url: "https://donberghuijs.nl"
baseurl: ""
lang: "nl"
author: "J.D. Berghuijs"
timezone: "Europe/Amsterdam"
markdown: kramdown
permalink: /artikelen/:year/:month/:day/:title/
# One canonical article pipeline: Jekyll _posts/, rendered at /blog/.
# `project_id` is optional front matter; future project pages can index it.
plugins:
  - jekyll-sitemap
  - jekyll-feed
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
